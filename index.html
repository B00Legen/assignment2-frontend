<!DOCTYPE html>
<html>

<head>
	<title>Flexbox Test</title>
	<style>
		body {
			background-color: #dedede;
		}
		.layout {
			display: grid;
			grid-template: auto auto auto / auto 1fr;
			justify-content: space-around;
			align-items: stretch;
			row-gap: 10px;
			column-gap: 30px;
		}
		.gallery {
			display: grid;
			grid-template: repeat(2, auto) / repeat(5, auto);
			justify-content: space-evenly;
			align-items: center;
			row-gap: 20px;
			column-gap: 20px;
		}
		.flexbox {
			display: flex;
			flex-wrap: wrap;
			justify-content: space-around;
			align-items: center;
		}
		header {
			grid-column: 1 / -1;
			background-color: #efefef;
		}
		aside {
			grid-column: 1;
			grid-row: 2;
			width: 50px;
			background-color: #efefef;
		}
		main {
			grid-column: 2;
			grid-row: 2;
			background-color: #efefef;
		}
		footer {
			grid-column: 1 / -1;
			background-color: #efefef;
		}
		h1, a, p { <!-- remove built-in padding and margin --!>
			line-height: 1;
			margin: 0px;
			padding: 0px;
		}
		.item {
			background-color: white;
			font-size: 25px;
		}
		.card {
			text-align: center;
			margin: 30px;
			padding: 20px;
			background-color: #dfdfdf;
			width: 200px;
			border: 5px solid gray;
			a, p {
				font-size: 25px;
			}
		}
		.card:hover {
			background-color: white;
		}
		.painting {
			position: relative;
			width: 200px;
		}
		.painting img {
			width: 200px;
			height: 300px;
		}
		.painting_text {
			background-color: white;
			display: none;
			position: absolute;
			top: 50%;
			left: 50%;
		}
		.painting:hover .painting_text {
			display: block;
		}
	</style>
</head>

<body>
	<div class="layout">

		</header>
		<main>

				</div>
				<div class="card">

				</div>
				<div class="card">
					<h1>Third</h1>

					<p>chess.com</p>
					<a href="https://chess.com/member/b00legen">Go to</a>
				</div>
			</div>
			<div class="gallery">
				<div class="painting">
					<img src="images/image0.png">

				</div>
				<div class="painting">
					<img src="images/image1.png">
					<p class="painting_text">cardiel._ximena</p>
				</div>
				<div class="painting">
					<img src="images/image2.png">

				</div>
				<div class="painting">
					<img src="images/image3.png">

				</div>
				<div class="painting">
